# =====================================================================
# find-it-campus · server 主配置
# 版本与约定来源：docs/architecture-baseline.md §9.2 / ADR-013 / ADR-016
# 原则：仓库里不出现任何真实密码与密钥 —— 敏感项一律 ${VAR:默认值} 从环境变量读。
#       本机私密覆盖写 application-local.yml（不提交），样例见 application-example.yml。
# =====================================================================

server:
  # 18080 而非 8080：开发机上 8080 已被本机另一个服务（upload-svc）长期占用，
  # 仓库默认端口直接对齐 18080，前端 Vite 代理同步指向它（README §五）。
  port: 18080
  # 返回体遇到错误时不携带堆栈（防信息泄漏），配合 GlobalExceptionHandler 使用
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      # 契约 §1.1：30 分钟无活动即失效。会话存在本进程内存里 ——
      # 进程重启 = 所有会话消失（用户表现为下一次请求 401，需重新登录）。
      # 这是单实例演示形态的已知限制，不是 bug；写进 deploy/DEPLOY-WINDOWS.md 与
      # docs/design/v2-auth-session.md，不在客户端做补偿。
      timeout: 30m
      # 只允许 Cookie 承载会话（P2-5）：禁止容器回退到 ;jsessionid 的 URL 重写，
      # 避免会话 id 出现在 URL、Referer 和中间代理日志里。
      tracking-modes: cookie
      cookie:
        # 显式写出默认值，让"证据里的 Cookie 名"和配置能对上（抓包/验收都按这个 grep）
        name: JSESSIONID
        path: /
        # 前端 JS 读不到会话 id：XSS 少一条直接偷会话的路径
        http-only: true
        # 跨站请求默认不携带 Cookie（CSRF 的主要防线，契约 §1.1）
        same-site: lax
        # 本地/演示是 http，置 true 会导致浏览器拒收 Cookie；生产在 HTTPS 前置代理后改 true
        secure: false

spring:
  application:
    name: find-it-campus
  datasource:
    url: '${FINDIT_DB_URL:jdbc:mysql://localhost:3306/find_it_campus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&connectTimeout=3000&socketTimeout=10000}'
    username: '${FINDIT_DB_USER:root}'
    password: '${FINDIT_DB_PASSWORD:}'
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: findit-pool
      # 为什么是 30 而不是 10（D1 实测结论，证据 docs/testing/v2/D1-idempotency.md §并发）：
      # 每条发布请求在 @Transactional 里持有一条连接直到提交；配对打分又固定占 2 条
      # （每个 worker 一条命名锁连接 + 事务连接）。20 并发发布 + 后台打分时，10 条连接会排队，
      # 实测发布 P99 528ms（阈值 500ms）；调到 30 后 P99 265ms。数字是这台 4 核机上的实测值，
      # 换机器/换并发目标要重测；生产按 DB 的 max_connections 与实例数分摊，不要直接抄 30。
      maximum-pool-size: '${FINDIT_DB_POOL_SIZE:30}'
      # 健康检查不许 hang：拿不到连接就尽快失败，由 /api/health 报 DOWN
      connection-timeout: 3000
      validation-timeout: 1000
  jackson:
    # 时间与 JacksonConfig 同口径：yyyy-MM-dd HH:mm:ss，本地时区，无毫秒
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  mvc:
    # 让 404 走 GlobalExceptionHandler，返回统一 body（10003），而不是默认错误页
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

mybatis:
  # 骨架阶段无 Mapper；3.1 起 XML 放 src/main/resources/mapper/**/*.xml
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # DB snake_case ↔ JSON camelCase（ADR-013）
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

findit:
  # 与 pom.xml 的 <version> 保持同值：这里刻意写死而不是用 Maven 资源过滤 ——
  # 打开 filtering 后 Maven 会把 Spring 的 ${VAR:默认} 占位符一并替换掉，得不偿失。
  version: 0.0.1-SNAPSHOT
  match:
    # local | external —— 取值非法时启动直接失败，不带病运行（MatchEngineConfig）
    engine: '${FINDIT_MATCH_ENGINE:local}'
    # 候选池上限：匹配成本不该随全表线性增长（架构基线 §10）。
    # 取值由 MatchService 读、由 RecordCandidatePoolAdapter 再兜一次底（防调用方误传超大值）
    pool-size: 500
    external:
      base-url: '${FINDIT_EMBED_BASE_URL:}'
      api-key: '${FINDIT_EMBED_API_KEY:}'
      timeout-ms: 3000
  # 配对/可见性策略：唯一配置类 PairPolicyProperties（A1 §7.1 冻结名）。
  # 这里只放默认值，业务语义见类注释；改口径只改这一处，禁止在代码里再写 0.90/30。
  pair:
    contact_direct_threshold: 0.90
    contact_unlock_threshold: 0.75
    completed_visible_threshold: 0.90
    completed_retention_days: 30
    notify_threshold: 0.75
    # 配对打分的工程参数（PairScoreProperties）。业务口径在上面的 findit.pair.*，
    # 这里是可以按压测结果调的运行参数。
    score:
      top-n: 10
      pre-score-pool-size: 200
      scan-limit: 500
      max-llm-calls: 500
      scan-cron: '0 30 3 * * *'
      stale-minutes: 10
      degraded-retry-minutes: 60
      # 必须明显小于 Hikari maximum-pool-size(10)：每对打分占一条连接做命名锁
      worker-threads: 2
      worker-queue-capacity: 200
  # LLM 通路（LlmProperties，架构 §8.1）。
  # **刻意没有 api-key 键**：密钥只从环境变量 DEEPSEEK_API_KEY 读（DeepSeekPairScorer），
  # 配置文件里出现密钥字段 = 给"把 key 提交进仓库"开了一个门缝。
  llm:
    base-url: '${FINDIT_LLM_BASE_URL:https://api.deepseek.com/v1}'
    model: '${FINDIT_LLM_MODEL:deepseek-chat}'
    connect-timeout-ms: 3000
    read-timeout-ms: 15000
    total-timeout-ms: 20000
    temperature: 0.0
    max-tokens: 256
    circuit-failure-threshold: 5
    circuit-open-duration: 5m
  # 发布闸门（ZHYYKFX-85，ReviewProperties）。
  # **默认 off**：v2.0 行为是回归基线，打开闸门必须显式改配置。ai 模式下发布异步审核，
  # 未通过绝不进公共列表/候选池/配对；AI 连续失败停在 PENDING 并转人工。
  review:
    mode: '${FINDIT_REVIEW_MODE:off}'
    max-attempts: 3
    retry-backoff-ms: 300
    max-tokens: 900
    timeout-ms: 45000
    prompt-version: pair-postprocess-v1
    summary-max-code-points: 40
    reconcile-interval-ms: 60000
    reconcile-batch-size: 20

logging:
  level:
    root: INFO
    com.findit.campus: INFO
  pattern:
    # requestId 贯穿日志与响应体，一个 id 从浏览器报错查到 SQL
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - [%X{requestId}] %msg%n'
