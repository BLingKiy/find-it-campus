# =====================================================================
# find-it-campus · Nginx for Windows 单端口 8088
# 由 start.ps1 以包内 nginx 目录作为 prefix 启动：
#   nginx.exe -p <pkg>\nginx\ -c conf/nginx.conf
# 因此下面的相对路径都相对于 <pkg>\nginx\。
#
# 前端：web/dist（Vue history 模式，回退 index.html）
# 后端：/api/ → 127.0.0.1:18080（Spring Boot）
# =====================================================================

worker_processes  1;
pid               ../runtime/nginx.pid;
error_log         ../logs/nginx-error.log warn;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    access_log    ../logs/nginx-access.log;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    client_max_body_size 3m;
    client_body_temp_path temp/client_body_temp;
    proxy_temp_path       temp/proxy_temp;
    fastcgi_temp_path     temp/fastcgi_temp;
    uwsgi_temp_path       temp/uwsgi_temp;
    scgi_temp_path        temp/scgi_temp;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    upstream findit_backend {
        server 127.0.0.1:18080;
        keepalive 16;
    }

    server {
        listen       8088;
        server_name  _;

        root   ../web/dist;
        index  index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer-when-downgrade always;

        # API 反代：proxy_pass 不带 URI，保留 /api/... 原路径。
        location /api/ {
            proxy_pass         http://findit_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 3s;
            proxy_send_timeout    15s;
            proxy_read_timeout    15s;
        }

        # Vue Router history 模式：/records/1、/records/new 等刷新不能 404。
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存；文件名带 hash，可长缓存。
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            # location 内出现 add_header 会覆盖 server 级，安全头需要重复声明。
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy no-referrer-when-downgrade always;
            try_files $uri =404;
        }
    }
}
